      PAPER_DATA_DIR: /data
      PAPER_READER_V2_ALLOWED_IDS: ${PAPER_READER_V2_ALLOWED_IDS:-1,15,21}
      PAPER_READER_V2_POLL_SECONDS: ${PAPER_READER_V2_POLL_SECONDS:-30}
      PAPER_READER_V2_SCRATCH_DIR: /scratch
      PAPER_READER_V2_SCRATCH_MAX_BYTES: ${PAPER_READER_V2_SCRATCH_MAX_BYTES:-1073741824}
      PAPER_READER_V2_SCRATCH_MIN_FREE_BYTES: ${PAPER_READER_V2_SCRATCH_MIN_FREE_BYTES:-536870912}
      PAPER_READER_V2_SCRATCH_STALE_SECONDS: ${PAPER_READER_V2_SCRATCH_STALE_SECONDS:-3600}
      PAPER_READER_V2_JOBS_DIR: /jobs
      PAPER_READER_V2_CONVERTER_URL: http://paper-reader-v2-converter:8091
      PAPER_READER_V2_CONVERTER_ALLOWED_HOSTS: paper-reader-v2-converter
      PAPER_READER_V2_CONVERTER_CLIENT_TIMEOUT_SECONDS: ${PAPER_READER_V2_CONVERTER_CLIENT_TIMEOUT_SECONDS:-1260}
      PAPER_PMC_BROKER_URL: http://paper-pmc-broker:8092
      PAPER_PMC_BROKER_ALLOWED_HOSTS: paper-pmc-broker
      PAPER_PMC_BROKER_TIMEOUT_SECONDS: ${PAPER_PMC_BROKER_TIMEOUT_SECONDS:-180}
      PAPER_OPS_EXECUTION_ENABLED: ${PAPER_OPS_EXECUTION_ENABLED:-true}
