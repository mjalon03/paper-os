      PAPER_DB_NAME: paper_os
      PAPER_DB_USER: paper_os
      PAPER_DB_PASSWORD: ${PAPER_DB_PASSWORD:?PAPER_DB_PASSWORD must be set}
      PAPER_DB_HOST: postgres
      PAPER_DB_PORT: "5432"
      PAPER_DRIVE_ORIGINAL: "paper-drive:Original"
      PAPER_RCLONE_BIN: /usr/local/bin/rclone
      PAPER_RCLONE_CONFIG: /config/rclone/rclone.conf
      PAPER_TAXONOMY_TMP_DIR: /work/taxonomy
      PAPER_DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      PAPER_TAXONOMY_WORKER_ID: taxonomy-worker-1
      PAPER_TAXONOMY_POLL_SECONDS: ${PAPER_TAXONOMY_POLL_SECONDS:-15}
      PAPER_TAXONOMY_AUDIT_INTERVAL_SECONDS: ${PAPER_TAXONOMY_AUDIT_INTERVAL_SECONDS:-43200}
      PAPER_TAXONOMY_GENERATION_LEASE_SECONDS: ${PAPER_TAXONOMY_GENERATION_LEASE_SECONDS:-300}
      PAPER_DEEPSEEK_TIMEOUT_SECONDS: ${PAPER_DEEPSEEK_TIMEOUT_SECONDS:-120}
      PAPER_TAXONOMY_RCLONE_TIMEOUT_SECONDS: ${PAPER_TAXONOMY_RCLONE_TIMEOUT_SECONDS:-900}
      PAPER_TAXONOMY_MOVE_LEASE_SECONDS: ${PAPER_TAXONOMY_MOVE_LEASE_SECONDS:-1800}
      PAPER_OPS_HEARTBEAT_ENABLED: ${PAPER_OPS_HEARTBEAT_ENABLED:-true}
      PAPER_OPS_HEARTBEAT_SERVICE_ID: paper-pipeline
      PAPER_OPS_HEARTBEAT_WORKER_ID: taxonomy-worker-1
      PAPER_OPS_HEARTBEAT_INTERVAL_SECONDS: ${PAPER_OPS_HEARTBEAT_INTERVAL_SECONDS:-30}
    mem_limit: 384m
    cpus: 0.5
    volumes:
      - paper_taxonomy_tmp:/work/taxonomy
      # rclone must persist refreshed Google OAuth tokens in this private volume.
      - ../../secrets/rclone:/config/rclone
      - ../../secrets/deepseek/api_key:/run/secrets/deepseek_api_key:ro
    networks:
      - paper_internal
      - paper_egress

  paper-ops-monitor:
    <<: *paper-container-security
    image: personal-os-paper-api:${PAPER_IMAGE_TAG:-0.6.0}
    build:
      context: ../..
      dockerfile: infra/papers/Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    command: ["python", "-m", "paper_service.ops_runtime"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PAPER_DB_NAME: paper_os
      PAPER_DB_USER: paper_os
      PAPER_DB_PASSWORD: ${PAPER_DB_PASSWORD:?PAPER_DB_PASSWORD must be set}
      PAPER_DB_HOST: postgres
      PAPER_DB_PORT: "5432"
      PAPER_OPS_RUNTIME_SERVICES_JSON: '{"paper-pipeline":["knowledge-worker-1","paper-worker-1","qa-worker-1","reader-v1-worker-1","reader-v2-worker-1","search-index-worker-1","taxonomy-worker-1"]}'
      PAPER_OPS_RUNTIME_MONITOR_INTERVAL_SECONDS: ${PAPER_OPS_RUNTIME_MONITOR_INTERVAL_SECONDS:-30}
      PAPER_OPS_RUNTIME_STALE_AFTER_SECONDS: ${PAPER_OPS_RUNTIME_STALE_AFTER_SECONDS:-120}
      PAPER_OPS_RUNTIME_STARTUP_GRACE_SECONDS: ${PAPER_OPS_RUNTIME_STARTUP_GRACE_SECONDS:-90}
    mem_limit: 256m
    cpus: 0.25
    networks:
      - paper_internal

volumes:
  paper_postgres_data:
  paper_data:
  paper_reader_v2_models:
  paper_reader_v2_scratch:
  paper_reader_v2_jobs:
  paper_pmc_scratch:
  paper_conversion_lock:
  paper_taxonomy_tmp:

networks:
  paper_internal:
    internal: true
  paper_egress:
  paper_parser_internal:
    internal: true
  paper_reader_v2_internal:
    internal: true
  paper_pmc_internal:
    internal: true
  web:
    external: true
