x-paper-logging: &paper-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-paper-container-security: &paper-container-security
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
  logging: *paper-logging

services:
  postgres:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: paper_os
      POSTGRES_USER: paper_os
      POSTGRES_PASSWORD: ${PAPER_DB_PASSWORD:?PAPER_DB_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper_os -d paper_os"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - paper_postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 1.0
    logging: *paper-logging
    networks:
      - paper_internal

  paper-data-init:
    image: alpine:3.24
    restart: "no"
    user: "0:0"
    network_mode: none
    command:
      - sh
      - -c
      - install -d -o 1000 -g 1000 /data/incoming /data/library/raw /data/library/mobile
    volumes:
      - paper_data:/data

  paper-reader-v2-models-init:
    image: alpine:3.24
    restart: "no"
    user: "0:0"
    network_mode: none
    command:
      - sh
      - -c
      - install -d -o 1000 -g 1000 /models
    volumes:
      - paper_reader_v2_models:/models

  paper-reader-v2-scratch-init:
    image: alpine:3.24
    restart: "no"
    user: "0:0"
    network_mode: none
    command:
      - sh
      - -c
      - install -d -m 0700 -o 1000 -g 1000 /scratch
    volumes:
      - paper_reader_v2_scratch:/scratch

  paper-reader-v2-jobs-init:
    image: alpine:3.24
    restart: "no"
    user: "0:0"
    network_mode: none
    command:
      - sh
      - -c
      - install -d -m 0700 -o 1000 -g 1000 /jobs
    volumes:
      - paper_reader_v2_jobs:/jobs

  paper-pmc-scratch-init:
    image: alpine:3.24
    restart: "no"
    user: "0:0"
    network_mode: none
    command:
      - sh
      - -c
      - install -d -m 0700 -o 1000 -g 1000 /work/pmc
    volumes:
      - paper_pmc_scratch:/work/pmc

  paper-taxonomy-tmp-init:
    image: alpine:3.24
    restart: "no"
    user: "0:0"
    network_mode: none
    command:
      - sh
      - -c
      - install -d -m 0700 -o 1000 -g 1000 /work/taxonomy
    volumes:
      - paper_taxonomy_tmp:/work/taxonomy

  paper-conversion-lock-init:
    image: alpine:3.24
    restart: "no"
    user: "0:0"
    network_mode: none
    command:
      - sh
      - -c
      - install -d -m 0700 -o 1000 -g 1000 /locks
    volumes:
      - paper_conversion_lock:/locks

  paper-api:
    <<: *paper-container-security
    build:
      context: ../..
      dockerfile: infra/papers/Dockerfile
    image: personal-os-paper-api:${PAPER_IMAGE_TAG:-0.6.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      paper-data-init:
        condition: service_completed_successfully
    environment:
      PAPER_DB_NAME: paper_os
      PAPER_DB_USER: paper_os
      PAPER_DB_PASSWORD: ${PAPER_DB_PASSWORD:?PAPER_DB_PASSWORD must be set}
      PAPER_DB_HOST: postgres
      PAPER_DB_PORT: "5432"
      PAPER_DATA_DIR: /data
      PAPER_ACCESS_ENFORCE: ${PAPER_ACCESS_ENFORCE:-true}
      PAPER_BROWSER_MUTATION_PROTECTION: ${PAPER_BROWSER_MUTATION_PROTECTION:-true}
      PAPER_ACCESS_TEAM_DOMAIN: ${PAPER_ACCESS_TEAM_DOMAIN:-https://rapid-king-ed86.cloudflareaccess.com}
      PAPER_ACCESS_AUDIENCE: ${PAPER_ACCESS_AUDIENCE:-666a2a49a6e448cf80a9041826b83c7dead160141e24ee8c3f00db30f2f3ef92}
      PAPER_PUBLIC_ORIGIN: ${PAPER_PUBLIC_ORIGIN:-https://papers.minjae-jo.com}
      PAPER_WRITES_ENABLED: ${PAPER_WRITES_ENABLED:-true}
      PAPER_VAULT_SYNC_SERVICE_ID: ${PAPER_VAULT_SYNC_SERVICE_ID:-}
      PAPER_KNOWLEDGE_MODEL: ${PAPER_KNOWLEDGE_MODEL:-deepseek-v4-pro}
      PAPER_QA_MODEL: ${PAPER_QA_MODEL:-deepseek-v4-flash}
    user: "1000:1000"
    mem_limit: 384m
    cpus: 0.5
    volumes:
      - paper_data:/data:ro
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)
    networks:
      - paper_internal
      - paper_egress
      - web

  paper-parser:
    <<: *paper-container-security
    image: personal-os-paper-api:${PAPER_IMAGE_TAG:-0.6.0}
    build:
      context: ../..
      dockerfile: infra/papers/Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    command: ["python", "-m", "paper_service.parser_service"]
    depends_on:
      paper-data-init:
        condition: service_completed_successfully
      paper-conversion-lock-init:
        condition: service_completed_successfully
    environment:
      PAPER_DATA_DIR: /data
      PAPER_PARSER_PORT: "8090"
      PAPER_PARSER_METADATA_TIMEOUT_SECONDS: ${PAPER_PARSER_METADATA_TIMEOUT_SECONDS:-90}
      PAPER_PARSER_READER_TIMEOUT_SECONDS: ${PAPER_PARSER_READER_TIMEOUT_SECONDS:-600}
      PAPER_CONVERSION_LOCK_FILE: /locks/heavy-conversion.lock
      PAPER_CONVERSION_LOCK_TIMEOUT_SECONDS: ${PAPER_CONVERSION_LOCK_TIMEOUT_SECONDS:-1900}
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.75
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=384m
    volumes:
      - paper_data:/data:ro
      - paper_conversion_lock:/locks
    expose:
      - "8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - paper_parser_internal

  paper-worker:
    <<: *paper-container-security
    image: personal-os-paper-api:${PAPER_IMAGE_TAG:-0.6.0}
    build:
      context: ../..
      dockerfile: infra/papers/Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: 768m
    cpus: 0.75
    command: ["python", "-m", "paper_service.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      paper-data-init:
        condition: service_completed_successfully
      paper-parser:
        condition: service_healthy
    environment:
      PAPER_DB_NAME: paper_os
      PAPER_DB_USER: paper_os
      PAPER_DB_PASSWORD: ${PAPER_DB_PASSWORD:?PAPER_DB_PASSWORD must be set}
      PAPER_DB_HOST: postgres
      PAPER_DB_PORT: "5432"
      PAPER_DATA_DIR: /data
      PAPER_DRIVE_INBOX: "paper-drive:Paper Inbox"
      PAPER_DRIVE_ORIGINAL: "paper-drive:Original"
      PAPER_RCLONE_CONFIG: /config/rclone/rclone.conf
      PAPER_DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      PAPER_PARSER_URL: http://paper-parser:8090
      PAPER_PARSER_ALLOWED_HOSTS: paper-parser
      PAPER_PARSER_METADATA_TIMEOUT_SECONDS: ${PAPER_PARSER_METADATA_CLIENT_TIMEOUT_SECONDS:-2000}
      PAPER_DEEPSEEK_MODEL: ${PAPER_DEEPSEEK_MODEL:-deepseek-v4-flash}
      PAPER_TAXONOMY_MODEL: ${PAPER_TAXONOMY_MODEL:-deepseek-v4-pro}
      PAPER_SYNC_TIMES: ${PAPER_SYNC_TIMES:-07:00,19:00}
      PAPER_TIMEZONE: ${PAPER_TIMEZONE:-Asia/Hong_Kong}
      PAPER_OPS_HEARTBEAT_ENABLED: ${PAPER_OPS_HEARTBEAT_ENABLED:-true}
      PAPER_OPS_HEARTBEAT_SERVICE_ID: paper-pipeline
      PAPER_OPS_HEARTBEAT_WORKER_ID: paper-worker-1
      PAPER_OPS_HEARTBEAT_INTERVAL_SECONDS: ${PAPER_OPS_HEARTBEAT_INTERVAL_SECONDS:-30}
    volumes:
      - paper_data:/data
      - ../../secrets/rclone:/config/rclone
      - ../../secrets/deepseek/api_key:/run/secrets/deepseek_api_key:ro
    networks:
      - paper_internal
      - paper_egress
      - paper_parser_internal

  paper-reader-v1-worker:
    <<: *paper-container-security
    image: personal-os-paper-api:${PAPER_IMAGE_TAG:-0.6.0}
    build:
      context: ../..
