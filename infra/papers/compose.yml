      PAPER_DB_PASSWORD: ${PAPER_DB_PASSWORD:?PAPER_DB_PASSWORD must be set}
      PAPER_DB_HOST: postgres
      PAPER_DB_PORT: "5432"
      PAPER_DATA_DIR: /data
      PAPER_PARSER_URL: http://paper-parser:8090
      PAPER_PARSER_ALLOWED_HOSTS: paper-parser
      PAPER_PARSER_READER_TIMEOUT_SECONDS: ${PAPER_PARSER_READER_CLIENT_TIMEOUT_SECONDS:-2520}
      PAPER_READER_V1_POLL_SECONDS: ${PAPER_READER_V1_POLL_SECONDS:-15}
      PAPER_OPS_HEARTBEAT_ENABLED: ${PAPER_OPS_HEARTBEAT_ENABLED:-true}
      PAPER_OPS_HEARTBEAT_SERVICE_ID: paper-pipeline
      PAPER_OPS_HEARTBEAT_WORKER_ID: reader-v1-worker-1
      PAPER_OPS_HEARTBEAT_INTERVAL_SECONDS: ${PAPER_OPS_HEARTBEAT_INTERVAL_SECONDS:-30}
    mem_limit: 384m
    cpus: 0.35
    volumes:
      - paper_data:/data
    networks:
      - paper_internal
      - paper_parser_internal

  paper-reader-v2-converter:
    <<: *paper-container-security
    image: personal-os-paper-reader-v2:${PAPER_IMAGE_TAG:-0.6.0}
    build:
      context: ../..
      dockerfile: infra/papers/Dockerfile.reader-v2
    restart: unless-stopped
    user: "1000:1000"
    command: ["python", "-m", "paper_service.reader_v2_converter_service"]
    depends_on:
      paper-reader-v2-models-init:
        condition: service_completed_successfully
      paper-reader-v2-jobs-init:
        condition: service_completed_successfully
      paper-conversion-lock-init:
        condition: service_completed_successfully
    environment:
      PAPER_READER_V2_JOBS_DIR: /jobs
      PAPER_READER_V2_CONVERTER_PORT: "8091"
      PAPER_READER_V2_CONVERTER_TIMEOUT_SECONDS: ${PAPER_READER_V2_CONVERTER_TIMEOUT_SECONDS:-1200}
      PAPER_CONVERSION_LOCK_FILE: /locks/heavy-conversion.lock
      PAPER_CONVERSION_LOCK_TIMEOUT_SECONDS: ${PAPER_CONVERSION_LOCK_TIMEOUT_SECONDS:-1900}
      HF_HOME: /models
      DOCLING_ARTIFACTS_PATH: /models/docling
    mem_limit: 2500m
    memswap_limit: 2500m
    cpus: 1.0
    pids_limit: 128
    volumes:
      - paper_reader_v2_jobs:/jobs
      - paper_reader_v2_models:/models:ro
      - paper_conversion_lock:/locks
    expose:
      - "8091"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - paper_reader_v2_internal

  paper-pmc-broker:
    <<: *paper-container-security
    image: personal-os-paper-api:${PAPER_IMAGE_TAG:-0.6.0}
    build:
      context: ../..
      dockerfile: infra/papers/Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    command: ["python", "-m", "paper_service.pmc_broker_service"]
    depends_on:
      paper-pmc-scratch-init:
        condition: service_completed_successfully
    environment:
      PAPER_PMC_BROKER_PORT: "8092"
      PAPER_PMC_BROKER_SCRATCH_DIR: /work/pmc
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    pids_limit: 64
    volumes:
      - paper_pmc_scratch:/work/pmc
    expose:
      - "8092"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8092/healthz', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - paper_pmc_internal
      - paper_egress

  paper-reader-v2-worker:
