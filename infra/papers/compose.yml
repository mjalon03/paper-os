      PAPER_OPS_RETRY_DELAY_SECONDS: ${PAPER_OPS_RETRY_DELAY_SECONDS:-60}
      PAPER_OPS_HEARTBEAT_ENABLED: ${PAPER_OPS_HEARTBEAT_ENABLED:-true}
      PAPER_OPS_HEARTBEAT_SERVICE_ID: paper-pipeline
      PAPER_OPS_HEARTBEAT_WORKER_ID: reader-v2-worker-1
      PAPER_OPS_HEARTBEAT_INTERVAL_SECONDS: ${PAPER_OPS_HEARTBEAT_INTERVAL_SECONDS:-30}
      TMPDIR: /scratch
      TMP: /scratch
      TEMP: /scratch
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 64
    volumes:
      - paper_data:/data
      - paper_reader_v2_scratch:/scratch
      - paper_reader_v2_jobs:/jobs
    networks:
      - paper_internal
      - paper_reader_v2_internal
      - paper_pmc_internal

